<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Journal video player</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#151515;font-family:Arial,sans-serif;color:#fff}
video{display:block;width:100%;height:100%;object-fit:contain;background:#151515}
.player-ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;box-sizing:border-box;pointer-events:none}
#playControl{min-width:62px;min-height:40px;padding:8px 18px;border:1px solid #ead7b5;border-radius:6px;background:#292320e8;color:#fff5dd;font-size:20px;cursor:pointer;pointer-events:auto}
#playControl:disabled{cursor:wait;font-size:14px}
#playerStatus{max-width:400px;box-sizing:border-box;padding:7px;background:#151515e8;font-size:12px;line-height:1.4;text-align:center;margin:0}
#originalLink{padding:6px 12px;background:#292320;color:#fff5dd;font-size:12px;border:1px solid #ead7b5;border-radius:4px;text-decoration:none;white-space:nowrap;pointer-events:auto}
[hidden]{display:none!important}
</style>
</head>
<body data-state="idle">
<video id="player" controls playsinline preload="none"></video>
<div class="player-ui">
<p id="playerStatus" role="status" aria-live="polite" hidden></p>
<button id="playControl" type="button" aria-label="Play video">▶</button>
<a id="originalLink" target="_blank" rel="noopener noreferrer" hidden>Watch original clip ↗</a>
</div>
<script src="../assets/native-player.e9bcc34add52.js"></script>
</body>
</html>
