/* Media are intentionally separate: X controls its iframe's intrinsic height. */
.video.x-official-tweet {
  display:block; width:100%; height:auto; min-height:0; aspect-ratio:auto;
  overflow:visible; background:transparent; border-radius:0;
}
.x-official-tweet .twitter-tweet { margin:0 auto!important; max-width:100%!important; }
/* X widget is internally capped at 560px. Keep its native width and scale the entire iframe. */
.x-official-tweet {position:relative;overflow:hidden!important;}

.video.youtube-slot { display:block; position:relative; width:100%; height:auto; min-height:0; aspect-ratio:16/9; overflow:hidden; background:#151515; }
.youtube-slot iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }

.related { height:22px; margin:0 0 20px auto; visibility:hidden; }
.related-panel { display:none!important; }

/* The old shutter is not used; only the real parchment fold animation remains. */
.roll-shutter { display:none!important; }


/* V25: CSS-only X player sizing. CSS zoom scales layout AND pixels together.
   The X widget is natively 560px wide. Desktop parchment media width is ~730px.

.x-official-tweet {display:block!important; height:auto!important; min-height:0!important; overflow:visible!important; background:transparent!important;}
.x-official-tweet iframe.twitter-tweet-rendered,
.x-official-tweet iframe {
  display:block!important;
  width:560px!important;
  max-width:none!important;
  height:auto;
  transform:none!important;
  margin:0!important;
  position:relative!important;
  zoom:1;
}
@media (min-width:1100px) {
  .x-official-tweet iframe.twitter-tweet-rendered,
  .x-official-tweet iframe { zoom:1.3; }
}
/* Smaller viewports retain native sizing to avoid cropping. */
@media (min-width:851px) and (max-width:1099px) {
  .x-official-tweet iframe.twitter-tweet-rendered,
  .x-official-tweet iframe { zoom:1; max-width:100%!important; width:100%!important; }
}
@media (max-width:850px) {
